  # Study profile code
  study_profile_ref: NUM-Studie
  # Study code
  # Example: "NUM RAPID_ELAPSE"
  study_code: <STUDY_CODE>

  # --------------- NO changes needed below this line. -------------------

storage_location_assignments_template:
  # root node in location tree.
  root_location:
    location_id: NUM

  # template for OE-specific storage location assignment.
  root_sub_locations:
    - location_id: ${ storage_root_location_id }
      sub_locations:
        - location_id: ${ location_name }
          location_schema_ref: ${ location_schema_ref }
          inherit_temperature: ${ inherit_temperature }
