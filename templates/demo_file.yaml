organisation_units:
  # List of organisation units to create/import.
  centers:
    # Unique code for the organisation unit.
    # Example: "RAPID_ELAPSE_10_Giessen"
    - code: <OE_CODE>
      # Display names in German/English.
      # Example: "Gießen ELAPSE/Gießen ELAPSE"
      name_de: <OE_DISPLAY_NAME_DE>
      name_en: <OE_DISPLAY_NAME_EN>
      # Parent of the organisation unit
      # Example: "RAPID_ELAPSE"
      parent_code: <PARENT_OE_CODE>
      # Existing root location in storage tree where this center belongs.
      # Example: "UKGM Universitätsklinikum Gießen / Marburg"
      storage_root_location_id: <EXISTING_STORAGE_ROOT_LOCATION>
      sub_locations:
        # Child storage location 1.
        # Example: "PP Lager RT ELAPSE"
        - location_name: <SUB_LOCATION_NAME_1>
          # schema reference for this sub-location
          # Example: "PPLAGER"
          location_schema_ref: <LOCATION_SCHEMA_REF_1>
          inherit_temperature: true
        # Child storage location 2.
        - location_name: <SUB_LOCATION_NAME_2>
          location_schema_ref: <LOCATION_SCHEMA_REF_2>
          inherit_temperature: false

